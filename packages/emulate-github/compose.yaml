name: github_emulator

services:
  github-emulator:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mock-github
    init: true
    ports:
      - "127.0.0.1:${EMULATOR_PORT:-4001}:4001"
    environment:
      &emulator-environment # Container networking; EMULATOR_PORT changes the published host port.
      EMULATE_PORT: "4001"
      EMULATE_BASE_URL: "${EMULATE_BASE_URL:-}"
      USE_PORTLESS: "${USE_PORTLESS:-0}"
      EMU_HOST: "0.0.0.0"
      EMULATOR_ENV_FILE: /config/mock.env
      GITHUB_EMULATOR_URL: "http://localhost:4001"
      EMULATOR_PUBLIC_URL: "http://localhost:${EMULATOR_PORT:-4001}"

      # HTTPS GitHub CLI access inside the interactive shell.
      GH_HOST: "github.emulator.test"
      SSL_CERT_FILE: "/proxy-data/caddy/pki/authorities/local/root.crt"

      # Seeded repository and local API authentication.
      REPO: "${REPO:-moyarich/release-smoke-test}"
      TOKEN: "${TOKEN:-local-test-token}"
      BASE_BRANCH: "${BASE_BRANCH:-main}"
      MANIFEST_PATH: "${MANIFEST_PATH:-packages/core/package.json}"
      OLD_VERSION: "${OLD_VERSION:-1.0.0}"

      # Disposable release smoke test (npm run docker:test).
      RELEASE_BRANCH: "${RELEASE_BRANCH:-}"
      NEW_VERSION: "${NEW_VERSION:-1.1.0}"
      UPDATE_PR_BODY: "${UPDATE_PR_BODY:-0}"
      EMU_LOG: "/tmp/emulate-github.log"
      KEEP_EMULATOR: "0"
      # Prevent recursive act replay when running the smoke-test service.
      RUN_ACT: "0"
    volumes:
      - proxy-data:/proxy-data:ro
      - type: bind
        source: ${EMULATOR_CONFIG_DIR:-./.local/config}
        target: /config
        read_only: true
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'source "/tmp/github-emulator-control-$$EMULATE_PORT/health.env" && curl -fsS -o /dev/null -H "Authorization: Bearer $$TOKEN" "$GITHUB_EMULATOR_URL/repos/$REPO"'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  smoke-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: smoke-test
    init: true
    environment:
      <<: *emulator-environment
      GH_HOST: ""
      SSL_CERT_FILE: ""
    command: ["/usr/local/bin/smoke-test-api.sh"]

  github-proxy:
    build:
      context: ./docker/proxy
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    depends_on:
      github-emulator:
        condition: service_healthy
    volumes:
      - proxy-data:/data
      - proxy-config:/config
    networks:
      default:
        aliases:
          - github.emulator.test
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  proxy-data:
  proxy-config:
