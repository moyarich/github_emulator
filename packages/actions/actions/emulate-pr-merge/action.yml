name: MoyaRich PR Merge Emulator
author: moyarich
description: Emulate merging a selected pull request and dispatch matching workflows with act.
branding:
  icon: server
  color: blue

inputs:
  repository:
    description: Repository to seed locally; does not access or modify the real repository
    default: ${{ github.repository }}
  token:
    description: Local emulator token; use a test value, not a real GitHub token
    default: local-test-token
  base-branch:
    description: Seeded base branch when using the default seed
    default: main
  pr-number:
    description: Pull request number to emulate without merging the real PR
    required: true
  workflow:
    description: Optional workflow path to validate; when omitted, matching workflows are discovered from the repository
    default: ""
  github-token:
    description: GitHub token with read access to the source repository and PR
    required: false

runs:
  using: composite
  steps:
    - name: Initialize merge-emulation inputs
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/initialize.sh"
    - name: Import selected PR without merging it
      shell: bash
      env:
        INPUT_BASE_BRANCH: ${{ inputs.base-branch }}
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/import-pr.sh"
    - name: Build sandbox and install act
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}/..
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/build-sandbox.sh"
    - name: Start isolated mock GitHub and event dispatcher
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
        GH_TOKEN: ${{ inputs.github-token }}
        ACTION_PATH: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/start-dispatcher.sh"
    - name: Prepare emulated merged PR
      shell: bash
      env:
        SELECTED_EVENT: pull_request
        MOCK_API_URL: http://127.0.0.1:4001
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/prepare-pr.sh"
    - name: Trigger merge event through mock GitHub gateway
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/trigger-merge.sh"
    - name: Await automatically dispatched workflows
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/await-workflows.sh"
    - name: Verify draft-only releases
      if: success()
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/verify-releases.sh"
    - name: Capture diagnostics
      if: always()
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/capture-diagnostics.sh"
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: emulated-pr-merge
        path: |
          ${{ runner.temp }}/pr-merge.log
          ${{ runner.temp }}/mock-releases.json
        if-no-files-found: ignore
    - name: Clean up
      if: always()
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bash "$ACTION_ROOT/dist/github-emulator/scripts/action/cleanup.sh"
