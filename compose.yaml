services:
  github-emulator:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: server
    init: true
    ports:
      - "127.0.0.1:${EMULATOR_PORT:-4001}:4001"
    environment: &emulator-environment
      # Container networking; EMULATOR_PORT changes the published host port.
      EMU_PORT: "4001"
      EMU_HOST: "0.0.0.0"
      API: "http://localhost:4001"
      PUBLIC_API: "http://localhost:${EMULATOR_PORT:-4001}"
      HOST_PORT: "${EMULATOR_PORT:-4001}"

      # HTTPS GitHub CLI access inside the interactive shell.
      GH_HOST: "github.emulator.test"
      SSL_CERT_FILE: "/proxy-data/caddy/pki/authorities/local/root.crt"

      # Seeded repository and local API authentication.
      REPO: "${REPO:-moyarich/release-smoke-test}"
      TOKEN: "${TOKEN:-local-test-token}"
      BASE_BRANCH: "${BASE_BRANCH:-main}"
      MANIFEST_PATH: "${MANIFEST_PATH:-packages/core/package.json}"
      OLD_VERSION: "${OLD_VERSION:-1.0.0}"

      # Disposable release smoke test (npm run docker:test).
      RELEASE_BRANCH: "${RELEASE_BRANCH:-}"
      NEW_VERSION: "${NEW_VERSION:-1.1.0}"
      UPDATE_PR_BODY: "${UPDATE_PR_BODY:-0}"
      EMU_LOG: "/tmp/emulate-github.log"
      KEEP_EMULATOR: "0"
      # act runs on the host; it is not installed in this image.
      RUN_ACT: "0"
    volumes:
      - proxy-data:/proxy-data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H \"Authorization: Bearer $$TOKEN\" http://127.0.0.1:4001/repos/$$REPO/contents/$$MANIFEST_PATH"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  smoke-test:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: smoke-test
    init: true
    environment:
      <<: *emulator-environment
      GH_HOST: ""
      SSL_CERT_FILE: ""
    command: ["/usr/local/bin/github-emulator-smoke-test"]

  github-proxy:
    build:
      context: ./docker/proxy
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    depends_on:
      github-emulator:
        condition: service_healthy
    volumes:
      - proxy-data:/data
      - proxy-config:/config
    networks:
      default:
        aliases:
          - github.emulator.test
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  proxy-data:
  proxy-config:
