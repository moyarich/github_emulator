name: Sync release package choices

on:
  workflow_dispatch:
    inputs:
      workspace-tools-source:
        description: Workspace Tools CLI source for package discovery
        type: choice
        required: true
        default: auto
        options:
          - auto
          - checkout:current
          - checkout:upstream;branch:main
          - registry:npm:latest
  push:
    branches: [main]
    paths:
      - package.json
      - packages/**/package.json
      - .github/workflows/release.yml
      - .github/workflows/release-draft.yml
      - .github/workflows/publish.yml
      - .github/workflows/restore-release.yml
      - .github/workflows/reset-release.yml
      - .github/workflows/sync-release-package-choices.yml

permissions: {}

jobs:
  sync:
    permissions:
      contents: write
      packages: read

    uses: moyarich/reusable-workflows/.github/workflows/reusable_sync-release-package-choices.yml@main

    with:
      workspace-tools-source: ${{ inputs.workspace-tools-source || 'auto' }}
      workflow-files: '[".github/workflows/check-dist.yml",".github/workflows/release-draft.yml",".github/workflows/release.yml",".github/workflows/restore-release.yml",".github/workflows/reset-release.yml",".github/workflows/publish.yml"]'
      packages-directory: packages
      use-workspaces: true
      require-publish-config: false

    secrets:
      workflow-token: ${{ secrets._WORKFLOW_TOKEN }}
