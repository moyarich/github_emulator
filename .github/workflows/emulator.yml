name: Test emulator action

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build action distribution
        run: |
          npm ci
          npm run build:actions
      - name: Start emulator for subsequent steps
        id: github
        uses: ./
      - name: Ensure GitHub CLI is installed
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
      - name: Exercise GitHub-dependent workflow logic
        env:
          API: ${{ steps.github.outputs.api-url }}
          GH_TOKEN: ${{ steps.github.outputs.token }}
          GH_ENTERPRISE_TOKEN: ${{ steps.github.outputs.token }}
          REPO: ${{ steps.github.outputs.repository }}
        run: |
          set -euo pipefail
          gh api "$API/repos/$REPO" --jq .full_name
          issue=$(gh api "$API/repos/$REPO/issues" --method POST -f title='Local workflow fixture' --jq .number)
          gh api "$API/repos/$REPO/issues/$issue" --jq .title
          release=$(gh api "$API/repos/$REPO/releases" --method POST -f tag_name=v1.0.0 -f name='Mock release' --jq .id)
          gh api "$API/repos/$REPO/releases/$release" --jq .tag_name
