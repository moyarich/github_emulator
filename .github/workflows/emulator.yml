name: Test emulator and prepare Marketplace release

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Test the emulator or prepare a Marketplace release draft
        required: true
        type: choice
        default: test
        options:
          - test
          - release
      version:
        description: Version tag (v1.0.0); required when operation is release
        required: false
        type: string

concurrency:
  group: emulator-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  emulator:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build action distribution
        run: |
          npm ci
          npm run build:actions
      - name: Start emulator for subsequent steps
        id: github
        uses: ./
      - name: Ensure GitHub CLI is installed
        run: |
          if ! command -v gh >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
      - name: Exercise GitHub-dependent workflow logic
        env:
          API: ${{ steps.github.outputs.api-url }}
          GH_TOKEN: ${{ steps.github.outputs.token }}
          GH_ENTERPRISE_TOKEN: ${{ steps.github.outputs.token }}
          REPO: ${{ steps.github.outputs.repository }}
        run: |
          set -euo pipefail
          gh api "$API/repos/$REPO" --jq .full_name
          issue=$(gh api "$API/repos/$REPO/issues" --method POST -f title='Local workflow fixture' --jq .number)
          gh api "$API/repos/$REPO/issues/$issue" --jq .title
          release=$(gh api "$API/repos/$REPO/releases" --method POST -f tag_name=v1.0.0 -f name='Mock release' --jq .id)
          gh api "$API/repos/$REPO/releases/$release" --jq .tag_name
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build Marketplace distribution
        run: |
          npm ci
          npm run build:actions
      - name: Verify emulator setup
        uses: ./
      - name: Create draft release for Marketplace review
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a version like v1.0.0' >&2; exit 2; }
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; update it explicitly in GitHub." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/action-release-notes.md" <<'NOTES'
          ## MoyaRich GitHub Emulator

          Start a local GitHub API for workflow tests with automatic post-job cleanup.
          The action exposes api-url, token, repository, and container-id outputs.
          Configure workflow clients to use the local API URL and test token.

          This release is a draft. Review the generated root action.yml and select
          Publish this Action to GitHub Marketplace when publishing in GitHub.
          NOTES
          gh release create "$VERSION" --draft --target "$RELEASE_SHA" \
            --title "MoyaRich GitHub Emulator $VERSION" \
            --notes-file "$RUNNER_TEMP/action-release-notes.md"
