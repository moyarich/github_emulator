name: Emulate PR merge flow
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Source owner/repo
        required: true
        default: moyarich/console
        type: string
      pr-number:
        description: Pull request number
        required: true
        default: "225"
        type: string
      workflow:
        description: Workflow to replay after mock merge
        required: true
        default: .github/workflows/release-approved-pr.yml
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  emulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Emulate PR merge and verify draft releases
        uses: ./
        with:
          repository: ${{ inputs.repository }}
          pr-number: ${{ inputs.pr-number }}
          workflow: ${{ inputs.workflow }}
          github-token: ${{ github.token }}
