name: CI / CLI and workspace quality
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
  workflow_call:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      checkout-sha:
        description: Exact commit SHA to validate
        type: string
        required: false
        default: ""
concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout-sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  cli:
    uses: moyarich/reusable-workflows/.github/workflows/reusable_ci_cli.yml@main
    with:
      checkout-sha: ${{ inputs.checkout-sha }}
