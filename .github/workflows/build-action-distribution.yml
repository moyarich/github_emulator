name: Build and commit action distribution

on:
  push:
    branches:
      - feat/emulate-pr-merge-flow-20261031
    paths:
      - packages/actions/src/**
      - packages/actions/actions/**
      - packages/actions/vite.config.ts
      - packages/actions/vite-plugin.ts
      - packages/emulate-github/**

permissions:
  contents: write

concurrency:
  group: build-action-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build action entry points and metadata
        run: npm run build:actions
      - name: Commit generated distribution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- action.yml actions/action.yml dist/github-emulator
          if git diff --cached --quiet; then
            echo "Action distribution is current"
            exit 0
          fi
          git commit -m "build(actions): regenerate action distribution"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
