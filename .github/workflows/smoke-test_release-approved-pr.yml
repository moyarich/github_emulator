name: Release PR smoke test

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-smoke-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPDATE_PR_BODY: '1'
      RUN_ACT: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Docker smoke-test action
        uses: ./
        with:
          mode: smoke-test
          update-pr-body: '1'
