name: CI / Smoke tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci_smoke-test.yml"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/ci_smoke-test.yml"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke-test:
    name: Emulator / Octokit smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --no-audit --no-fund
      - name: Run all TypeScript smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find packages -type f -name '*.smoke-test.ts' -not -path '*/node_modules/*' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No *.smoke-test.ts files found"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "::group::${file}"
            (
              cd "$(dirname "$(dirname "$file")")"
              node --experimental-strip-types "./test/$(basename "$file")"
            )
            echo "::endgroup::"
          done
