name: Release package

run-name: >-
  Release · ${{ inputs.package }} · ${{ inputs.version-mode }}${{ inputs.version-mode
  == 'bump' && format(':{0}', inputs.version-bump) || inputs.version-mode == 'exact'
  && format(':{0}', inputs.exact-version) || '' }} · ${{ inputs.draft && 'draft' ||
  'published' }} · dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      workspace-tools-source:
        description: Workspace Tools CLI source for package discovery
        type: choice
        required: true
        default: auto
        options:
          - auto
          - checkout:current
          - checkout:upstream;branch:main
          - registry:npm:latest
      package:
        description: Select a publishable workspace package
        required: true
        type: choice
        default: all
        options:
          - all
          - "packages/example"
      version-mode:
        description: Resolve each package version
        type: choice
        required: true
        default: auto
        options: [auto, bump, package-json, exact]
      initial-version:
        description: Initial release version for auto mode
        type: string
        required: true
        default: "0.1.0"
      version-bump:
        description: SemVer increment for bump mode
        type: choice
        required: true
        default: patch
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
      exact-version:
        description: Version for exact mode (all selected packages)
        type: string
        required: false
        default: ""
      commit-version-changes:
        description: Commit prepared versions and lockfile to the selected branch before release
        type: boolean
        required: true
        default: false
      update-major-tag:
        description: Update package-scoped major compatibility alias
        type: boolean
        required: true
        default: true
      draft:
        description: |
          Prepare draft GitHub Releases
          (disable only to explicitly finalize)
        type: boolean
        required: true
        default: true
      dry-run:
        description: Validate without creating a GitHub Release, tag, or package
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-package-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  release:
    name: Release selected packages
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_workspace-package-release.yml@main
    with:
      workspace-tools-source: ${{ inputs.workspace-tools-source }}
      package: ${{ inputs.package }}
      version-mode: ${{ inputs.version-mode }}
      initial-version: ${{ inputs.initial-version }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}
      commit-version-changes: ${{ inputs.commit-version-changes }}
      update-major-tag: ${{ inputs.update-major-tag }}
      draft: ${{ inputs.draft }}
      dry-run: ${{ inputs.dry-run }}
